services:
  - type: web
    name: sales-tracker-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /data/receipts.db
      - key: JWT_SECRET
        generateValue: true
